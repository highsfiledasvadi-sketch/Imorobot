plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.emo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.emo"
        minSdk 16
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
